<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#103a2c" />
    <meta name="description" content="一款輕巧的 HTML5 恐龍跳躍遊戲。" />
    <title>小恐龍跑酷

    </title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="game-heading">
        <p class="eyebrow">DINO RUNNER / 01</p>
        <h1>小恐龍跑酷</h1>
      </header>

      <section class="game-frame" aria-label="小恐龍跑酷遊戲">
        <canvas
          id="game-canvas"
          width="960"
          height="360"
          aria-label="遊戲畫面。按空白鍵或點擊畫面開始與跳躍。"
          tabindex="0"
        >
          你的瀏覽器不支援 HTML5 Canvas。
        </canvas>
      </section>

      <footer class="game-footer">
        <p class="control-hint"><kbd>Space</kbd> 跳躍 <span aria-hidden="true">·</span> 點擊畫面也可以</p>
        <div class="music-controls" aria-label="背景音樂控制">
          <button id="music-toggle" class="music-toggle" type="button" aria-pressed="false">播放音樂</button>
          <label for="music-volume">音量</label>
          <input id="music-volume" type="range" min="0" max="100" value="35" step="1" />
          <output id="music-volume-value" for="music-volume">35%</output>
        </div>
        <p class="game-note">避開仙人掌，收集金幣，跑得越遠越好。</p>
      </footer>
    </main>
    <audio
      id="background-music"
      src="assets/dino-dash-cyber-run-1-clean.mp3"
      loop
      preload="none"
    ></audio>
  </body>
</html>
